name: RaceDay Part 2 - Build and Test
on:
  push:
  pull_request:
jobs:
  build-and-test:
    name: Build API and Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore API dependencies
        run: dotnet restore RaceDay.API/RaceDay.API.csproj
      - name: Restore test dependencies
        run: dotnet restore RaceDay.Tests/RaceDay.Tests.csproj
      - name: Build API
        run: dotnet build RaceDay.API/RaceDay.API.csproj --configuration Release --no-restore
      - name: Build test project
        run: dotnet build RaceDay.Tests/RaceDay.Tests.csproj --configuration Release
      - name: Run unit tests
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-build --verbosity normal

