name: RaceDay Part 3 - Build and Test
on:
  push:
    branches:
      - Part3
  pull_request:
    branches:
      - Part3
jobs:
  build-and-test:
    name: Build RaceDay Solution and Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore RaceDay.sln
      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test RaceDay.Test/RaceDay.Test.csproj --configuration Release --no-build --verbosity normal
